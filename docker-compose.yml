services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Migrations (one-shot). Runs before any backend replica starts.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: no long-running process to health-check.
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Backend (FastAPI). Scalable: `docker compose up --scale backend=3`.
  # No host port; reach it through nginx on :8000.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Override localhost URLs from .env with Docker service hostnames
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RELOAD: "true"
      RUN_MIGRATIONS: "false"
    expose:
      - "8000"
    volumes:
      # Mount source code so --reload picks up changes without rebuilding
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # Load balancer (S6.3). Round-robin over every backend replica.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "8000:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frontend (Next.js dev server with hot-reload)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Server-side rewrite target (container-to-container, via the LB)
      BACKEND_URL: http://nginx:8080
      # Browser-side API base (nginx on the exposed host port)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source for hot-reload.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Bind-mount Next config so rewrites/config changes apply without rebuild.
      - ./frontend/next.config.ts:/app/next.config.ts
      # Anonymous volume shadows the bind mount for node_modules so the
      # container's pre-built copy is used and the host cannot clobber it.
      - /app/node_modules
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres_data:
