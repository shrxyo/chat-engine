# S6.3 — load balancer in front of N backend replicas.
# Mounted as /etc/nginx/conf.d/default.conf (http context) in docker-compose.yml.
#
# Round-robin, no stickiness: backends are stateless. A socket's channel events
# reach it via Redis Pub/Sub (S6.1) whichever replica it lands on.

# Docker's embedded DNS. `resolve` below re-queries it, so replicas added or
# removed with `docker compose up --scale backend=N` join the pool without an
# nginx restart.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend {
    zone backend 64k;
    # Passive health checks: two failed attempts take a replica out for 5s.
    server backend:8000 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
}

# WebSocket upgrade. Plain HTTP requests get an empty Connection header, which
# lets nginx reuse upstream keepalive connections.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

log_format lb '$remote_addr "$request" $status '
              'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;
    access_log /dev/stdout lb;

    # nginx's own liveness, independent of the backends.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # S7.3: metrics are per replica and internal. Prometheus scrapes each
    # backend directly over the compose network; through the LB they would
    # come from a random replica and be public.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Retry the next replica if one is down. nginx never retries
        # non-idempotent requests (POST) that already reached a backend.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Long-lived WebSockets: keep idle sockets open for an hour.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
